<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 — 艺航卫浴</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="images/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<style>
  :root {
    --brand: #1258A8;
    --brand-dark: #0d3f7c;
    --brand-light: #e8f0fb;
    --text: #1f2937;
    --muted: #6b7280;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 20px; text-align: center;
  }
  .box {
    background: #fff; border-radius: 18px; max-width: 560px; width: 100%;
    padding: 48px 32px 40px; box-shadow: 0 24px 60px rgba(0,0,0,.22);
  }
  .logo { height: 34px; margin: 0 auto 26px; display: block; }
  .code {
    font-size: 96px; font-weight: 800; line-height: 1; letter-spacing: 4px;
    color: var(--brand); margin-bottom: 14px;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  p.desc { font-size: 15px; color: var(--muted); line-height: 1.8; margin-bottom: 28px; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 12px 26px; border-radius: 999px;
    font-size: 15px; text-decoration: none; transition: .2s;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-ghost { background: var(--brand-light); color: var(--brand); }
  .btn-ghost:hover { background: #d8e6f8; }
  .links { margin-top: 30px; padding-top: 22px; border-top: 1px solid #eef1f5; }
  .links a { color: var(--muted); text-decoration: none; font-size: 14px; margin: 0 10px; }
  .links a:hover { color: var(--brand); }
  .foot { margin-top: 22px; font-size: 12px; color: rgba(255,255,255,.75); line-height: 1.9; }
  @media (max-width: 480px) {
    .box { padding: 36px 22px 30px; }
    .code { font-size: 72px; }
    .logo { height: 28px; }
  }
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="images/logo.jpg" alt="艺航卫浴 YIHAN">
    <div class="code">404</div>
    <h1>页面走丢了</h1>
    <p class="desc">您访问的页面不存在，或已被移动。<br>可以返回首页继续浏览产品与工厂实景。</p>
    <div class="btns">
      <a class="btn btn-primary" href="/">返回首页</a>
      <a class="btn btn-ghost" href="/#products">浏览产品</a>
      <a class="btn btn-ghost" href="/#contact">联系我们</a>
    </div>
    <div class="links">
      <a href="/#about">公司简介</a>
      <a href="/#honor">资质荣誉</a>
      <a href="/#products">产品中心</a>
      <a href="/#news">品牌动态</a>
      <a href="/#contact">联系方式</a>
    </div>
  </div>
  <div class="foot">
    泉州宝宏厨卫有限公司 · 艺航卫浴 &nbsp;|&nbsp; 400-966-8109 &nbsp;|&nbsp; 226603925@qq.com
  </div>
</body>
</html>
